
```yml
name: Daily Training Plan

on:
  schedule:
    # 北京时间每天 17:00 = UTC 每天 09:00
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  daily-training-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Create daily training issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();

            // 转换为北京时间
            const bjDate = new Intl.DateTimeFormat("zh-CN", {
              timeZone: "Asia/Shanghai",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              weekday: "long"
            }).format(now);

            const bjDay = new Intl.DateTimeFormat("en-US", {
              timeZone: "Asia/Shanghai",
              weekday: "long"
            }).format(now);

            const planMap = {
              Monday: {
                title: "综合力量 A：下肢 + 核心 + 肩胛",
                body: `
## 今日训练：综合力量 A

目标：建立下肢基础力量、髋核心稳定和肩胛控制。  
强度：RPE 5–7，保留 3–4 次余力。  
原则：不练爆，不追重量，手腕保持中立。

| 动作 | 组数 × 次数 | 重点 |
|---|---:|---|
| 高脚杯箱式深蹲 | 2–3 × 8 | 膝盖对脚尖，不追求深度 |
| 哑铃 / 壶铃罗马尼亚硬拉 | 2–3 × 8 | 髋折叠，背中立，手腕中立 |
| 弹力带划船 | 3 × 12 | 肩胛向后下方滑，不耸肩 |
| 哑铃地板卧推，中立握 | 2 × 8–10 | 替代俯卧撑，手腕不折 |
| Pallof Press，弹力带绕前臂 | 2 × 8/侧 | 抗旋转，腰不拧 |
| 站姿提踵 | 2–3 × 12–15 | 慢上慢下 |
| 仰卧脚跟滑动 | 2 × 6/侧 | 不抬头，不卷腹 |

### 调整规则

- 如果下肢 DOMS ≥ 6/10：改为恢复日
- 如果手腕痛：跳过卧推和抓握类动作
- 如果颈部恶心或头痛：只做呼吸、散步和轻活动度
`
              },
              Tuesday: {
                title: "Zone 2 有氧：骑车 / 快走",
                body: `
## 今日训练：Zone 2 有氧

目标：建立心肺底盘，为骑行、徒步、羽毛球和自由搏击打基础。

| 内容 | 要求 |
|---|---|
| 方式 | 骑车 / 快走 / 坡度走 / 椭圆机 |
| 时间 | 30–45 分钟 |
| 强度 | 能完整说话，微微喘但不憋 |
| 心率 | 优先 120–145，超过 160 就降速 |
| 结束标准 | 练完感觉更精神，而不是被榨干 |

### 注意

今天不是练速度，也不是练意志力。  
如果小跑心率很快到 170+，就不要跑，改成骑车或快走。
`
              },
              Wednesday: {
                title: "恢复 + 活动度 + 颈肩腰维护",
                body: `
## 今日训练：恢复日

目标：降低耸肩代偿，改善肩胛内侧酸痛，恢复颈胸腰活动。

| 动作 | 量 |
|---|---:|
| 仰卧腹式呼吸 | 1–2 分钟 |
| 提肩胛肌温和拉伸 | 30 秒/侧 |
| 胸小肌门框拉伸 | 30 秒/侧 |
| 开书式胸椎旋转 | 6 次/侧 |
| 弹力带划船 | 2 × 12 |
| Face Pull | 2 × 10 |
| 墙面滑动 | 1–2 × 6 |
| 轻松散步 / 骑车 | 20–40 分钟，可选 |

### 今日提示

脖子变长，肩膀变宽，肩胛骨像贴在肋骨上轻轻滑动。  
不要猛夹肩胛，也不要用力把肩膀往下压死。
`
              },
              Thursday: {
                title: "综合力量 B：单腿 + 上肢 + 搬运",
                body: `
## 今日训练：综合力量 B

目标：提升单腿稳定、上肢拉力、肩胛控制和运动表现。

| 动作 | 组数 × 次数/时间 | 重点 |
|---|---:|---|
| 台阶上步 | 2–3 × 8/侧 | 徒步专项，台阶不要太高 |
| 扶墙分腿蹲 / 轻重量分腿蹲 | 2 × 6–8/侧 | 膝盖不内扣 |
| 单臂哑铃划船，中立握 | 2–3 × 10/侧 | 可胸靠桌边，避免手掌撑地 |
| Face Pull | 2–3 × 10–12 | 轻重量，肩膀远离耳朵 |
| 轻农夫提拿 | 2 × 20–30 秒 | 腕痛则跳过 |
| 弹力带侧走 | 2 × 10/侧 | 骨盆稳定，不塌腰 |
| 胫骨前肌抬脚尖 | 2 × 12–15 | 下坡、跑走、踝稳定 |

### 调整规则

- 手腕痛：跳过农夫提拿
- 股四或臀腿酸痛明显：台阶上步和分腿蹲减半
- 颈肩紧：Face Pull 和划船都减轻阻力
`
              },
              Friday: {
                title: "休息或轻松散步",
                body: `
## 今日训练：休息 / 轻松恢复

目标：恢复，而不是补课。

| 内容 | 建议 |
|---|---|
| 轻松散步 | 20–40 分钟 |
| 仰卧腹式呼吸 | 2 分钟 |
| 开书式胸椎旋转 | 6 次/侧 |
| 梨状肌轻拉伸 | 30 秒/侧 |
| 股四轻拉伸 | 20–30 秒/侧 |
| 小腿拉伸 | 30 秒/侧 |

### 今日提示

如果这周训练后 DOMS 明显，今天就完全休息。  
恢复也是训练的一部分。
`
              },
              Saturday: {
                title: "专项轮换日",
                body: `
## 今日训练：专项轮换日

从下面选择一个，不要全部都做。

| 项目 | 起步方式 | 注意 |
|---|---|---|
| 骑行 | 45–60 分钟轻松骑 | 不追速度，不猛爬坡 |
| 徒步 | 60–90 分钟轻徒步 | 下坡量不要突然增加 |
| 羽毛球 | 30–45 分钟低强度娱乐局 | 避免连续急停急转 |
| 攀岩 | 45–60 分钟低难度技术路线 | 不做抱石硬冲，不抓小点 |
| 自由搏击 | 15–25 分钟站架、步伐、影子拳 | 不打重沙袋，不对抗 |

### 自由搏击预备选项

| 动作 | 时间 |
|---|---:|
| 原地站架轻弹 | 3 × 30 秒 |
| 前后重心转移 | 2 × 30 秒 |
| 左右横移 | 3 × 30 秒 |
| Jab 单拳 | 3 × 30 秒 |
| Jab–Cross | 3 × 30 秒 |

### 今日原则

专项日只做一个主题。  
练完应该觉得“还想再练一点”，不要练到崩。
`
              },
              Sunday: {
                title: "长有氧或完全休息",
                body: `
## 今日训练：长有氧 / 完全休息

根据疲劳程度选择。

### 选项 A：状态好

| 内容 | 要求 |
|---|---|
| 轻松骑车 / 徒步 / 快走 | 60–90 分钟 |
| 强度 | 能完整说话 |
| 心率 | 尽量稳定，不追速度 |

### 选项 B：状态一般

| 内容 | 要求 |
|---|---|
| 散步 | 20–40 分钟 |
| 颈肩腰维护 | 8–10 分钟 |

### 选项 C：状态差

完全休息。  
睡觉、吃饭、补水，不补训练债。
`
              }
            };

            const todayPlan = planMap[bjDay];

            const issueTitle = `今日训练计划｜${bjDate}｜${todayPlan.title}`;

            const issueBody = `
# ${issueTitle}

${todayPlan.body}

---

## 每日记录

\`\`\`text
睡眠：
压力：
训练完成情况：
总时长：
平均心率：
最高心率：
RPE：
手腕疼痛 0–10：
颈部不适 0–10：
腰部不适 0–10：
第二天 DOMS 0–10：
备注：
\`\`\`

---

## 通用进阶标准

| 指标 | 可以进阶 | 暂停进阶 |
|---|---|---|
| DOMS | 第二天 ≤ 3/10 | 第二天 ≥ 6/10 |
| 心率 | 有氧能说完整句 | 轻运动就 170+ |
| 手腕 | 训练中无痛 | 抓握、支撑、旋转痛 |
| 颈部 | 不恶心、不头痛 | 头晕、恶心、颈痛加重 |
| 腰 | 训练后无加重 | 放射痛、明显腰顶着酸 |
| 睡眠 | 睡醒恢复好 | 疲劳连续 3 天 |
`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["training", "daily-plan"]
            });
